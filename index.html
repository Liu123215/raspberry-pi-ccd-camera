<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3efe8">
<title>光影相机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='40' rx='10' fill='%233c5145'/%3E%3Ccircle cx='32' cy='34' r='13' fill='%23f4e9d8'/%3E%3Ccircle cx='32' cy='34' r='8' fill='%233c5145'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--paper:#f4f1ea;--ink:#252e28;--muted:#737b71;--green:#405d4e;--line:#dedfd5;--cream:#ebe7dd;--red:#bb5949}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ca8c4f;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}.shell{max-width:1370px;margin:auto;padding:26px 5vw 52px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff}.brand-name{font-weight:750;letter-spacing:.14em;font-size:17px}.brand-sub{color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:-3px}.top-note{font-size:12px;letter-spacing:.12em;color:#69746a}.top-note:before,.status-dot{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#789582;margin-right:8px;vertical-align:middle}.heading{margin-bottom:23px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#8b9588;font-weight:700}.heading h1{font-family:Georgia,"Songti SC","SimSun",serif;font-weight:500;font-size:clamp(28px,3vw,40px);letter-spacing:.08em;margin:7px 0}.heading p{color:#6e786e;margin:0;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}.camera-card{background:#e6e5dd;padding:12px;border:1px solid #d7dad1;border-radius:14px;box-shadow:0 14px 42px rgba(53,65,55,.08)}.viewfinder{position:relative;aspect-ratio:4/3;background:#1d2521;border-radius:8px;overflow:hidden;display:grid;place-items:center}.viewfinder img{width:100%;height:100%;position:absolute;inset:0;object-fit:contain}.viewfinder.ccd img{filter:sepia(.13) saturate(.88) contrast(.94) brightness(1.04)}.viewfinder:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 23%,transparent 70%,rgba(0,0,0,.32))}.view-overlay{position:absolute;z-index:2;inset:0;pointer-events:none;color:#fff}.view-top{display:flex;justify-content:space-between;padding:20px;font-size:11px;letter-spacing:.16em;text-shadow:0 1px 3px #000}.live-dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:#f2b9a2;margin-right:7px}.corners{position:absolute;inset:17% 14%;background:linear-gradient(#fff,#fff) left top/24px 1px no-repeat,linear-gradient(#fff,#fff) left top/1px 24px no-repeat,linear-gradient(#fff,#fff) right top/24px 1px no-repeat,linear-gradient(#fff,#fff) right top/1px 24px no-repeat,linear-gradient(#fff,#fff) left bottom/24px 1px no-repeat,linear-gradient(#fff,#fff) left bottom/1px 24px no-repeat,linear-gradient(#fff,#fff) right bottom/24px 1px no-repeat,linear-gradient(#fff,#fff) right bottom/1px 24px no-repeat;opacity:.48}.view-bottom{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-shadow:0 1px 3px #000}.placeholder{position:relative;z-index:1;text-align:center;color:#b7c0b6;font-size:14px;padding:24px}.placeholder strong{display:block;color:#e8ebe3;font-size:16px;font-weight:500;margin-bottom:7px}.placeholder[hidden]{display:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 18px 12px}.control-label{font-size:10px;letter-spacing:.16em;color:#849084;font-weight:700;margin-bottom:7px}.mode-group{display:flex;background:#dcded5;border-radius:9px;padding:3px;gap:3px}.mode{border:0;background:transparent;color:#647064;padding:7px 13px;border-radius:7px;font-size:13px;min-height:38px}.mode[aria-pressed=true]{background:#fff;color:#34483b;box-shadow:0 1px 4px #0002}.shutter-wrap{text-align:center;min-width:94px}.shutter{width:72px;height:72px;border-radius:50%;border:2px solid #506b59;background:transparent;display:grid;place-items:center;padding:5px;transition:transform .2s}.shutter:hover:not(:disabled){transform:scale(1.05)}.shutter-inner{display:block;width:100%;height:100%;border-radius:50%;background:var(--green);box-shadow:inset 0 0 0 3px #e3e7df}.shutter-caption{font-size:11px;color:#657168;margin-top:6px}.counter{text-align:right;min-width:100px}.counter strong{font-family:Georgia,serif;font-weight:400;font-size:24px}.counter span{font-size:11px;color:#7a8579;display:block}.side{display:grid;gap:16px}.panel{background:#fbfaf6;border:1px solid #e3e5dc;border-radius:13px;padding:22px}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-top h2{font-family:Georgia,"Songti SC",serif;font-size:20px;font-weight:500;margin:0}.panel-top span{font-size:10px;letter-spacing:.16em;color:#99a296}.description{font-size:13px;color:#818a7e;margin:5px 0 17px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:488px;overflow:auto}.shot{padding:0;aspect-ratio:1;position:relative;overflow:hidden;border:0;border-radius:7px;background:#e9e9e2}.shot img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.shot:hover img{transform:scale(1.04)}.empty{grid-column:1/-1;min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8e978a;font-size:13px;border:1px dashed #d8ddd2;border-radius:8px}.empty svg{margin-bottom:10px;color:#a0aa9c}.tips{background:#e7ebe2;border-color:#e1e6dc}.tips .small-title{font-size:11px;font-weight:700;letter-spacing:.13em;color:#657866}.tips p{font-size:13px;color:#66766a;margin:9px 0 0;line-height:1.7}.status{margin-top:14px;color:#6d7c6e;font-size:12px;min-height:19px}.status.error{color:#a3453a}.status.error .status-dot{background:#bb5949}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:10px;letter-spacing:.12em;color:#929c8e}.modal{position:fixed;inset:0;z-index:10;background:rgba(20,27,22,.83);display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}.modal-card{width:min(900px,100%);max-height:95vh;background:#f6f4ef;border-radius:12px;overflow:auto}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}.modal-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.modal-actions{display:flex;gap:8px}.icon-button,.download{min-height:42px;border:1px solid #d2d8cd;background:#fff;border-radius:7px;padding:8px 12px;color:#34483b;text-decoration:none;font-size:13px}.modal-img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#1c241f}.flash{animation:flash .35s ease}@keyframes flash{0%{filter:brightness(2)}100%{filter:none}}@media(max-width:850px){.shell{padding:20px 20px 36px}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.gallery{max-height:340px}.top{margin-bottom:22px}}@media(max-width:520px){.top-note{font-size:10px}.heading h1{font-size:29px}.camera-card{padding:8px}.controls{padding:18px 4px 10px;gap:5px}.mode{padding:6px 9px}.shutter{width:62px;height:62px}.counter{min-width:58px}.counter strong{font-size:20px}.side{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}.empty{min-height:130px}.foot{font-size:9px}.view-top{padding:12px}.view-bottom{bottom:12px;left:12px;right:12px}}
.modal-name{min-width:0}.modal-actions{flex-shrink:0}.icon-button,.download{min-height:44px}.delete-photo{color:#a23b31;border-color:#e2b9b3}.delete-photo:hover:not(:disabled){background:#fff1ee}.modal-status{padding:0 18px 12px;color:#a3453a;font-size:13px}.modal-status:empty{display:none}@media(max-width:520px){.modal-top{align-items:stretch;flex-direction:column}.modal-actions{width:100%}.modal-actions>*{flex:1;text-align:center}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h4l1.5-2.5h7L17 8h4v11H3z"/><circle cx="12" cy="13.5" r="3.5"/></svg></div><div><div class="brand-name">光影相机</div><div class="brand-sub">MOMENTS IN FRAME</div></div></div><div class="top-note">留住此刻的光</div></header>
<section class="heading"><div class="eyebrow">A LITTLE CAMERA FOR EVERYDAY</div><h1>把日常，拍成回忆。</h1><p>按下快门，收藏眼前的每一瞬间。</p></section>
<div class="layout"><section aria-label="相机"><div class="camera-card"><div class="viewfinder ccd" id="viewfinder"><div class="placeholder" id="placeholder"><strong>正在连接摄像头</strong><span>请稍候，正在准备取景画面…</span></div><img id="preview" alt="摄像头实时取景画面" hidden><div class="view-overlay" aria-hidden="true"><div class="view-top"><span><i class="live-dot"></i>LIVE VIEW</span><span>CAMERA 01</span></div><div class="corners"></div><div class="view-bottom"><span id="view-mode">CCD TONE</span><span id="clock"></span></div></div></div><div class="controls"><div><div class="control-label">选择色调 / TONE</div><div class="mode-group" role="group" aria-label="照片色调"><button class="mode" type="button" data-effect="ccd" aria-pressed="true">CCD</button><button class="mode" type="button" data-effect="original" aria-pressed="false">原色</button></div></div><div class="shutter-wrap"><button id="capture" class="shutter" type="button" aria-label="拍照" disabled><span class="shutter-inner"></span></button><div class="shutter-caption">按下拍照</div></div><div class="counter"><strong id="count">00</strong><span>张照片</span></div></div></div><div id="status" class="status" role="status" aria-live="polite"><i class="status-dot"></i><span>正在连接摄像头…</span></div></section>
<aside class="side"><section class="panel"><div class="panel-top"><h2>最近的照片</h2><span>YOUR MOMENTS</span></div><p class="description">点开照片查看和保存</p><div id="gallery" class="gallery"><div class="empty">正在加载照片…</div></div></section><section class="panel tips"><div class="small-title">✳ &nbsp; 拍摄小贴士</div><p>让光线落在喜欢的事物上。<br>CCD 色调为模拟效果，预览与成片可能略有差异。</p></section></aside></div>
<footer class="foot"><span>MADE FOR EVERYDAY MOMENTS</span><span>用心记录 · 慢慢生活</span></footer></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="查看照片" hidden><div class="modal-card"><div class="modal-top"><div class="modal-name" id="modal-name"></div><div class="modal-actions"><a class="download" id="download" download>下载</a><button class="icon-button delete-photo" id="delete-photo" type="button">删除</button><button class="icon-button" id="close" type="button" aria-label="关闭照片">关闭</button></div></div><div class="modal-status" id="modal-status" role="status" aria-live="polite"></div><img class="modal-img" id="modal-img" alt="拍摄的照片"></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s), preview=$('#preview'), view=$('#viewfinder'), placeholder=$('#placeholder'), capture=$('#capture'), gallery=$('#gallery'), status=$('#status'), modal=$('#modal');let effect='ccd',ready=false,busy=false,lastFocus=null,failures=0,currentPhoto=null,deleting=false;
function message(text,error=false){status.classList.toggle('error',error);status.querySelector('span').textContent=text}
function setReady(value,detail){ready=value;capture.disabled=!ready||busy;if(value){placeholder.hidden=true;preview.hidden=false;message('摄像头已连接，可以拍照');}else{placeholder.hidden=false;preview.hidden=true;placeholder.innerHTML='<strong>摄像头暂不可用</strong><span></span>';placeholder.querySelector('span').textContent=detail||'请检查摄像头连接后重试';message(detail||'摄像头暂不可用',true)}}
function startPreview(){preview.src='/stream?t='+Date.now()}
preview.addEventListener('error',()=>{if(ready){setReady(false,'实时画面连接中断，正在尝试重新连接')}});
async function checkStatus(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error('无法读取相机状态');const data=await response.json();const ok=data.ready===true;if(ok){failures=0;if(!ready){setReady(true);startPreview()}}else{const reason=data.error||'请检查摄像头连接后重试';setReady(false,reason)} }catch(e){failures++;if(failures>=2)setReady(false,'无法连接相机服务，正在重试')}finally{setTimeout(checkStatus,5000)}}
for(const button of document.querySelectorAll('.mode'))button.addEventListener('click',()=>{effect=button.dataset.effect;for(const b of document.querySelectorAll('.mode'))b.setAttribute('aria-pressed',String(b===button));view.classList.toggle('ccd',effect==='ccd');$('#view-mode').textContent=effect==='ccd'?'CCD TONE':'ORIGINAL';});
async function loadPhotos(){try{const response=await fetch('/api/photos',{cache:'no-store'});if(!response.ok)throw Error('照片列表加载失败');const data=await response.json();const photos=Array.isArray(data.photos)?data.photos:[];$('#count').textContent=String(photos.length).padStart(2,'0');gallery.replaceChildren();if(!photos.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<svg width="31" height="31" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="7" width="26" height="20" rx="3"/><circle cx="16" cy="17" r="5"/><path d="M9 7l2-3h10l2 3"/></svg><span>还没有照片<br>拍下第一张吧</span>';gallery.append(empty);return true}for(const photo of photos){const btn=document.createElement('button');btn.className='shot';btn.type='button';btn.setAttribute('aria-label','查看照片 '+photo.name);const img=document.createElement('img');img.src=photo.url;img.alt=photo.name;img.loading='lazy';btn.append(img);btn.addEventListener('click',()=>openPhoto(photo));gallery.append(btn)}return true}catch(e){gallery.textContent='照片加载失败，请稍后刷新页面';message('照片列表加载失败',true);return false}}
function openPhoto(photo){currentPhoto=photo;lastFocus=document.activeElement;$('#modal-status').textContent='';$('#modal-name').textContent=photo.name;$('#modal-img').src=photo.url;$('#download').href=photo.url;$('#download').download=photo.name;modal.hidden=false;$('#close').focus()}
function closePhoto(){if(deleting)return;modal.hidden=true;currentPhoto=null;$('#modal-img').removeAttribute('src');if(lastFocus)lastFocus.focus()}$('#close').addEventListener('click',closePhoto);modal.addEventListener('click',e=>{if(e.target===modal)closePhoto()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closePhoto()});
$('#delete-photo').addEventListener('click',async()=>{if(deleting||!currentPhoto)return;if(!window.confirm('将这张照片移到树莓派的回收站吗？\n可以在树莓派的文件管理器中恢复。'))return;const name=currentPhoto.name,button=$('#delete-photo'),close=$('#close');deleting=true;button.disabled=true;close.disabled=true;button.textContent='删除中…';$('#modal-status').textContent='';try{const response=await fetch('/api/photos/'+encodeURIComponent(name),{method:'DELETE'});let data={};try{data=await response.json()}catch{}if(!response.ok||data.ok!==true)throw Error(data.error||'删除失败，请重试');deleting=false;closePhoto();const refreshed=await loadPhotos();if(refreshed)message('照片已移到树莓派的回收站');const next=gallery.querySelector('button');if(next)next.focus()}catch(e){$('#modal-status').textContent=e.message||'删除失败，请重试'}finally{deleting=false;button.disabled=false;close.disabled=false;button.textContent='删除'}});
capture.addEventListener('click',async()=>{if(!ready||busy)return;busy=true;capture.disabled=true;message('正在记录这一刻…');try{const response=await fetch('/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({effect})});let data={};try{data=await response.json()}catch{}if(!response.ok||!data.url)throw Error(data.error||'拍照失败，请重试');view.classList.remove('flash');void view.offsetWidth;view.classList.add('flash');await loadPhotos();message('照片已保存，点击右侧缩略图查看');}catch(e){message(e.message||'拍照失败，请重试',true)}finally{busy=false;capture.disabled=!ready}});
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).replaceAll('/','.')}tick();checkStatus();loadPhotos();})();
</script>
</body></html>
