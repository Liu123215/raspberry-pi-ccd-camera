<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171d19">
<title>光影相机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='40' rx='10' fill='%238eaa93'/%3E%3Ccircle cx='32' cy='34' r='13' fill='%231a211c'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#151a17;--panel:#202822;--border:#364139;--text:#eef2ea;--muted:#a3b1a4;--accent:#b5d2b6;--red:#eb877b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #e7bc77;outline-offset:3px}.app{max-width:1440px;margin:auto;padding:24px 28px 48px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;display:grid;place-items:center;background:#b5d2b6;color:#202b22;border-radius:13px;font-size:22px}.brand strong{display:block;font-size:18px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#819388}.connection.online .dot{background:#9bd5a4}.connection.error .dot{background:#ed8c7c}.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}.intro h1{font-size:clamp(23px,3vw,32px);margin:0 0 4px;letter-spacing:.02em}.intro p{margin:0;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px;align-items:start}.camera,.album{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}.viewfinder{position:relative;aspect-ratio:4/3;background:#0c100d;display:grid;place-items:center;overflow:hidden}.viewfinder img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.viewfinder.ccd img{filter:sepia(.13) saturate(.88) contrast(.94) brightness(1.04)}.viewfinder:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0008,transparent 20%,transparent 75%,#0009)}.overlay{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:white;text-shadow:0 1px 4px #000}.overlay-row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;letter-spacing:.08em}.live{display:flex;align-items:center;gap:7px}.live:before{content:"";width:7px;height:7px;background:#b5d2b6;border-radius:50%}.recording .live:before{background:#ff766c;box-shadow:0 0 0 4px #ff766c33}.recording .live{color:#ffaaa2}.reticle{position:absolute;inset:22% 23%;opacity:.38;background:linear-gradient(white,white) left top/22px 1px no-repeat,linear-gradient(white,white) left top/1px 22px no-repeat,linear-gradient(white,white) right top/22px 1px no-repeat,linear-gradient(white,white) right top/1px 22px no-repeat,linear-gradient(white,white) left bottom/22px 1px no-repeat,linear-gradient(white,white) left bottom/1px 22px no-repeat,linear-gradient(white,white) right bottom/22px 1px no-repeat,linear-gradient(white,white) right bottom/1px 22px no-repeat}.placeholder{position:relative;z-index:1;text-align:center;color:#b8c7b9;padding:20px}.placeholder strong{display:block;color:white;font-size:16px;margin-bottom:6px}.placeholder[hidden]{display:none}.controls{padding:18px 22px 20px}.control-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.label{font-size:12px;color:var(--muted)}.mode-group,.tabs{display:flex;gap:4px;background:#161e19;padding:4px;border-radius:10px}.mode,.tab{border:0;color:#a9b8aa;background:transparent;border-radius:7px;padding:8px 14px;min-height:40px}.mode[aria-pressed=true],.tab[aria-selected=true]{background:#43574a;color:#fff}.actions{display:flex;align-items:center;gap:12px}.shutter,.record-button,.secondary,.delete,.download{border:1px solid #4c5d50;border-radius:10px;min-height:46px;padding:10px 16px;background:#2e3b31;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.shutter{background:var(--accent);color:#19281e;border-color:var(--accent);font-weight:700;flex:1}.shutter:before{content:"";width:15px;height:15px;border:2px solid currentColor;border-radius:50%}.record-button{flex:1}.record-button:before{content:"";width:11px;height:11px;background:var(--red);border-radius:50%}.record-button.is-recording{border-color:#d77d71;color:#ffd2ca;background:#50312d}.record-button.is-recording:before{border-radius:2px}.feedback{min-height:21px;color:var(--muted);font-size:13px;margin:13px 0 0}.feedback.error{color:#ffb0a4}.album-head{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.album-head h2{font-size:18px;margin:0}.album-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.album-tools{padding:0 20px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.tab{font-size:13px;padding:7px 13px}.refresh{border:0;background:none;color:var(--accent);min-height:40px;padding:8px;white-space:nowrap}.album-body{padding:0 20px 20px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:640px;overflow:auto}.tile{aspect-ratio:1;position:relative;border:0;padding:0;background:#111713;border-radius:9px;overflow:hidden;color:#fff}.tile img,.tile video{display:block;width:100%;height:100%;object-fit:cover}.tile:after{content:"▶";position:absolute;right:7px;bottom:7px;background:#101711cc;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-size:10px}.tile.photo:after{display:none}.empty{grid-column:1/-1;min-height:170px;display:grid;place-content:center;text-align:center;border:1px dashed #46584a;border-radius:10px;color:var(--muted);padding:20px}.album-hint{color:#94a496;font-size:12px;margin:14px 0 0}.footer{margin-top:24px;color:#77887a;font-size:12px;display:flex;justify-content:space-between;gap:12px}.modal{position:fixed;inset:0;background:#070b08d9;z-index:10;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modal-card{width:min(960px,100%);max-height:94vh;overflow:auto;border-radius:15px;background:#232d25;border:1px solid #405044}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px}.filename{font-size:12px;overflow-wrap:anywhere;color:#c4d2c4}.modal-actions{display:flex;gap:8px;flex-wrap:wrap}.secondary,.download,.delete{min-height:42px;padding:8px 12px;font-size:13px}.delete{color:#ffb1a6;border-color:#7b4d47;background:#47302c}.media{display:block;width:100%;max-height:72vh;object-fit:contain;background:#090d0a}.media[hidden]{display:none}.modal-error{color:#ffb0a4;font-size:13px;padding:0 15px}.modal-error:empty{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(4,minmax(0,1fr));max-height:none}}@media(max-width:540px){.app{padding:16px 14px 32px}.header{margin-bottom:22px}.brand strong{font-size:16px}.intro h1{font-size:24px}.intro p{font-size:13px}.connection{font-size:12px}.controls{padding:16px}.overlay{padding:13px}.album-head{padding:17px 16px 12px}.album-tools{padding:0 16px 12px}.album-body{padding:0 16px 16px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.actions{gap:8px}.shutter,.record-button{padding:9px;min-width:0}.modal-head{align-items:stretch;flex-direction:column}.modal-actions>*{flex:1}.footer{flex-direction:column}}
</style></head>
<body><main class="app">
<header class="header"><div class="brand"><div class="logo" aria-hidden="true">◉</div><div><strong>光影相机</strong><small>LIGHT &amp; SHADOW CAMERA</small></div></div><div class="connection" id="connection"><span class="dot"></span><span id="connection-text">正在连接</span></div></header>
<section class="intro"><div><h1>记录眼前的每一刻</h1><p>取景、拍照或录像，作品都会保存在相册里。</p></div></section>
<div class="layout"><section class="camera" aria-label="相机取景与操作"><div class="viewfinder ccd" id="viewfinder"><div class="placeholder" id="placeholder"><strong>正在连接摄像头</strong><span>请稍候，正在准备取景画面…</span></div><img id="preview" alt="摄像头实时取景" hidden><div class="overlay" aria-hidden="true"><div class="overlay-row"><span class="live" id="live-label">实时取景</span><span id="record-time"></span></div><div class="reticle"></div><div class="overlay-row"><span id="view-mode">CCD 色调</span><span id="clock"></span></div></div></div>
<div class="controls"><div class="control-head"><span class="label">照片色调</span><div class="mode-group" role="group" aria-label="照片色调"><button class="mode" data-effect="ccd" aria-pressed="true">CCD</button><button class="mode" data-effect="original" aria-pressed="false">原色</button></div></div><div class="actions"><button class="shutter" id="capture" type="button" disabled>拍照</button><button class="record-button" id="video-toggle" type="button" disabled>开始录像</button></div><p class="feedback" id="status" role="status" aria-live="polite">正在连接摄像头…</p><p class="label" style="margin:8px 0 0">录像为原色、无声音；录像时请先停止再拍照。</p></div></section>
<aside class="album" aria-label="相册"><div class="album-head"><div><h2>相册</h2><p>照片与录像 · 保存在树莓派上</p></div><span class="label" id="album-count"></span></div><div class="album-tools"><div class="tabs" role="tablist" aria-label="相册分类"><button class="tab" role="tab" aria-selected="true" data-tab="photos">照片</button><button class="tab" role="tab" aria-selected="false" data-tab="videos">录像</button></div><button class="refresh" id="refresh-album" type="button">刷新相册</button></div><div class="album-body"><div id="gallery" class="gallery" role="tabpanel"></div><p class="album-hint">点击作品查看、下载或移至回收站。</p></div></aside></div>
<footer class="footer"><span>CCD 色调由软件模拟，预览和成片可能略有差异。</span><span>LIGHT &amp; SHADOW</span></footer></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="查看作品" hidden><div class="modal-card"><div class="modal-head"><span class="filename" id="modal-name"></span><div class="modal-actions"><a class="download" id="download" download>下载</a><button class="delete" id="delete" type="button">删除</button><button class="secondary" id="close" type="button">关闭</button></div></div><p class="modal-error" id="modal-error" role="status"></p><img class="media" id="modal-image" alt="拍摄的照片" hidden><video class="media" id="modal-video" controls playsinline preload="metadata" hidden></video></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ready=false,recording=null,capturing=false,videoBusy=false,effect='ccd',tab='photos',photos=[],videos=[],selected=null,deleting=false,lastFocus=null,streamActive=false;
function feedback(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function controls(){ $('capture').disabled=!ready||!!recording||capturing;$('video-toggle').disabled=!ready||videoBusy;$('video-toggle').textContent=recording?'停止录像':'开始录像';$('video-toggle').classList.toggle('is-recording',!!recording);$('viewfinder').classList.toggle('recording',!!recording);$('live-label').textContent=recording?'正在录像':'实时取景';$('view-mode').textContent=recording?'原色录像':effect==='ccd'?'CCD 色调':'原色'}
async function json(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts});let d;try{d=await r.json()}catch{throw Error('服务返回了无法识别的数据')}if(!r.ok)throw Error(d.error||'操作失败，请重试');return d}
async function checkStatus(){try{const d=await json('/api/status');const wasReady=ready;ready=d.ready===true;recording=d.recording||null;$('connection').className='connection '+(ready?'online':'error');$('connection-text').textContent=ready?'摄像头已连接':'摄像头不可用';$('placeholder').hidden=ready;$('preview').hidden=!ready;if(ready&&!streamActive){$('preview').src='/stream?t='+Date.now();streamActive=true}if(!ready){streamActive=false;$('placeholder').querySelector('strong').textContent='摄像头暂不可用';$('placeholder').querySelector('span').textContent=d.error||'请检查摄像头连接';feedback(d.error||'摄像头暂不可用',true)}else if(!wasReady){feedback('摄像头已连接，可以拍摄')}controls()}catch(e){ready=false;streamActive=false;$('connection').className='connection error';$('connection-text').textContent='连接中断';$('placeholder').hidden=false;$('preview').hidden=true;$('placeholder').querySelector('strong').textContent='连接已中断';$('placeholder').querySelector('span').textContent='正在尝试重新连接…';controls();feedback('无法连接相机服务，正在重试',true)}}
$('preview').addEventListener('error',()=>{streamActive=false;ready=false;controls();feedback('取景画面中断，正在重连',true)});
for(const b of document.querySelectorAll('.mode'))b.addEventListener('click',()=>{effect=b.dataset.effect;for(const other of document.querySelectorAll('.mode'))other.setAttribute('aria-pressed',String(other===b));$('viewfinder').classList.toggle('ccd',effect==='ccd');controls()});
$('capture').addEventListener('click',async()=>{if(!ready||recording||capturing)return;capturing=true;controls();feedback('正在拍照…');try{await json('/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({effect})});feedback('照片已保存');await loadAlbum()}catch(e){feedback(e.message,true)}finally{capturing=false;controls()}});
$('video-toggle').addEventListener('click',async()=>{if(!ready||videoBusy)return;videoBusy=true;controls();feedback(recording?'正在保存录像…':'正在启动录像…');try{await json(recording?'/api/video/stop':'/api/video/start',{method:'POST'});const stopped=!!recording;await checkStatus();feedback(stopped?'录像已保存':'正在录像…');if(stopped){tab='videos';updateTabs();await loadAlbum()}}catch(e){feedback(e.message,true);await checkStatus()}finally{videoBusy=false;controls()}});
function updateTabs(){for(const b of document.querySelectorAll('.tab'))b.setAttribute('aria-selected',String(b.dataset.tab===tab));renderAlbum()}
for(const b of document.querySelectorAll('.tab'))b.addEventListener('click',()=>{tab=b.dataset.tab;updateTabs()});
function renderAlbum(){const items=tab==='photos'?photos:videos;const gallery=$('gallery');gallery.replaceChildren();$('album-count').textContent=items.length+' 项';if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=tab==='photos'?'还没有照片，拍下第一张吧。':'还没有录像，开始记录吧。';gallery.append(empty);return}for(const item of items){const b=document.createElement('button');b.className='tile '+(tab==='photos'?'photo':'video');b.type='button';b.setAttribute('aria-label',(tab==='photos'?'查看照片 ':'查看录像 ')+item.name);const media=document.createElement(tab==='photos'?'img':'video');media.src=item.url;media.loading='lazy';if(tab==='photos')media.alt='';else {media.muted=true;media.preload='metadata';media.playsInline=true}b.append(media);const type=tab;b.addEventListener('click',()=>openItem(item,type));gallery.append(b)}}
async function loadAlbum(){try{const [p,v]=await Promise.all([json('/api/photos'),json('/api/videos')]);photos=Array.isArray(p.photos)?p.photos:[];videos=Array.isArray(v.videos)?v.videos:[];renderAlbum()}catch(e){feedback('相册加载失败：'+e.message,true)}}$('refresh-album').addEventListener('click',loadAlbum);
function openItem(item,type){selected={...item,type};lastFocus=document.activeElement;$('modal-name').textContent=item.name;$('modal-error').textContent='';$('download').href=item.url;$('download').download=item.name;$('modal-image').hidden=type!=='photos';$('modal-video').hidden=type!=='videos';if(type==='photos')$('modal-image').src=item.url;else $('modal-video').src=item.url;$('modal').hidden=false;$('close').focus()}
function closeItem(){if(deleting)return;$('modal').hidden=true;$('modal-video').pause();$('modal-video').removeAttribute('src');$('modal-image').removeAttribute('src');selected=null;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}$('close').addEventListener('click',closeItem);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeItem()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeItem()});
$('delete').addEventListener('click',async()=>{if(!selected||deleting)return;const item=selected;if(!confirm('将这'+(item.type==='photos'?'张照片':'段录像')+'移到树莓派的回收站吗？\n可以在文件管理器中恢复。'))return;deleting=true;$('delete').disabled=true;$('close').disabled=true;try{await json('/api/'+item.type+'/'+encodeURIComponent(item.name),{method:'DELETE'});deleting=false;closeItem();await loadAlbum();feedback('已移到树莓派的回收站')}catch(e){$('modal-error').textContent=e.message}finally{deleting=false;$('delete').disabled=false;$('close').disabled=false}});
function tick(){const now=new Date();$('clock').textContent=now.toLocaleDateString('zh-CN');$('record-time').textContent=recording&&recording.started?new Date(Math.max(0,Date.now()-recording.started*1000)).toISOString().slice(11,19):''}tick();checkStatus();loadAlbum();setInterval(tick,1000);setInterval(checkStatus,5000);
})();
</script></body></html>
